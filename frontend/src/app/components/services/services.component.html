<!-- Services Section -->
<section id="services" class="relative py-24 bg-vuk-dark-900 overflow-hidden">

  <!-- Background elements -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-[10%] left-[15%] w-2 h-2 bg-vuk-primary-400 rounded-full animate-pulse"></div>
    <div class="absolute top-[25%] left-[75%] w-1 h-1 bg-vuk-accent-400 rounded-full animate-pulse" style="animation-delay:.5s"></div>
    <div class="absolute top-[60%] left-[20%] w-1.5 h-1.5 bg-vuk-primary-300 rounded-full animate-pulse" style="animation-delay:1s"></div>
    <div class="absolute top-[80%] right-[15%] w-2 h-2 bg-vuk-accent-300 rounded-full animate-pulse" style="animation-delay:1.5s"></div>
    <div class="absolute top-1/4 -left-20 w-96 h-96 bg-vuk-primary-500/15 rounded-full blur-3xl animate-spin-slow"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-vuk-accent-500/15 rounded-full blur-3xl animate-spin-slow" style="animation-direction:reverse"></div>
  </div>

  <div class="container mx-auto px-6 relative z-10">

    <!-- Header -->
    <div class="text-center mb-16">
      <div class="flex justify-center mb-5">
        <img src="logo_VUK_simples.PNG" alt="VUK" class="h-16 w-16 object-contain wolf-icon-section">
      </div>
      <h2 class="font-display text-5xl md:text-6xl font-bold mb-4">
        <span class="bg-gradient-vuk bg-clip-text text-transparent">Nossos Serviços</span>
      </h2>
      <p class="text-xl text-vuk-dark-300 max-w-2xl mx-auto">
        Soluções completas de marketing e propaganda para fazer sua marca brilhar
      </p>
    </div>

    <!-- Services Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (service of services; track service.title; let i = $index) {
        <div
          #serviceCard
          class="service-card group relative rounded-2xl overflow-hidden cursor-pointer"
          style="height: 380px"
          (mousemove)="onMouseMove($event, serviceCard)"
          (mouseleave)="onMouseLeave(serviceCard)">

          <!-- Background image -->
          <img
            [src]="service.image"
            [alt]="service.title"
            class="card-image absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">

          <!-- Gradient overlay sempre visível -->
          <div class="absolute inset-0 bg-gradient-to-t from-vuk-dark-950/95 via-vuk-dark-950/50 to-transparent"></div>

          <!-- Colored gradient top overlay -->
          <div class="absolute inset-0 bg-gradient-to-b {{ service.gradient }} opacity-70 group-hover:opacity-90 transition-opacity duration-500"></div>

          <!-- Glowing border on hover -->
          <div class="card-border absolute inset-0 rounded-2xl border border-white/10 group-hover:border-opacity-100 transition-all duration-500"
               [style.--accent]="service.accentColor"></div>

          <!-- Tag -->
          <div class="absolute top-4 left-4 z-10">
            <span class="tag-pill px-3 py-1 text-xs font-bold uppercase tracking-widest rounded-full bg-white/10 backdrop-blur-sm border border-white/20 text-white">
              {{ service.tag }}
            </span>
          </div>

          <!-- Icon badge -->
          <div class="absolute top-4 right-4 z-10 w-12 h-12 rounded-xl flex items-center justify-center text-2xl backdrop-blur-sm bg-white/10 border border-white/20 transition-all duration-300 group-hover:scale-110 group-hover:rotate-6">
            {{ service.icon }}
          </div>

          <!-- Content — sobe ao hover -->
          <div class="card-content absolute bottom-0 left-0 right-0 p-6 z-10 translate-y-4 group-hover:translate-y-0 transition-transform duration-500">
            <h3 class="font-display text-2xl font-bold text-white mb-2 drop-shadow-lg">
              {{ service.title }}
            </h3>
            <p class="text-vuk-dark-200 text-sm leading-relaxed opacity-0 group-hover:opacity-100 transition-all duration-500 delay-75 max-h-0 group-hover:max-h-24 overflow-hidden">
              {{ service.description }}
            </p>

            <!-- CTA -->
            <div class="mt-4 flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-all duration-500 delay-150">
              <span class="text-sm font-semibold text-white">Saiba mais</span>
              <svg class="w-4 h-4 text-white transform group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
              </svg>
            </div>
          </div>

          <!-- Shine effect on hover -->
          <div class="card-shine absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>

        </div>
      }
    </div>

  </div>
</section>
