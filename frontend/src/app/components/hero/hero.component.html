<!-- Hero Section -->
<section id="hero" class="relative min-h-screen flex items-center justify-center overflow-hidden">

  <!-- Layer 1: Deep dark base (primeiro, mais abaixo) -->
  <div class="absolute inset-0 bg-vuk-dark-950"></div>

  <!-- Layer 2: Animated grid on top -->
  <div class="absolute inset-0 grid-bg pointer-events-none"></div>

  <!-- Layer 3: Radial center glow -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_80%_60%_at_50%_50%,_rgba(139,92,246,0.12)_0%,_transparent_70%)] pointer-events-none"></div>

  <!-- Layer 4: Mouse-tracking glow 1 -->
  <div class="absolute w-[600px] h-[600px] bg-vuk-primary-500 rounded-full blur-[150px] opacity-20 transition-all duration-700 ease-out pointer-events-none"
       [style.left.%]="glowX"
       [style.top.%]="glowY"
       style="transform: translate(-50%, -50%)"></div>

  <!-- Layer 5: Mouse-tracking glow 2 -->
  <div class="absolute w-[400px] h-[400px] bg-vuk-accent-500 rounded-full blur-[120px] opacity-15 transition-all duration-1000 ease-out pointer-events-none"
       [style.left.%]="glow2X"
       [style.top.%]="glow2Y"
       style="transform: translate(-50%, -50%)"></div>

  <!-- Floating ambient orbs -->
  <div class="absolute top-1/4 left-10 w-72 h-72 bg-vuk-primary-600/10 rounded-full blur-3xl animate-float pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-10 w-96 h-96 bg-vuk-accent-600/10 rounded-full blur-3xl animate-float-reverse pointer-events-none"></div>

  <!-- Particles -->
  <div class="absolute inset-0 pointer-events-none">
    @for (p of particles; track p.id) {
      <div class="absolute rounded-full animate-pulse"
           [style.left.%]="p.x"
           [style.top.%]="p.y"
           [style.width.px]="p.size"
           [style.height.px]="p.size"
           [style.background]="p.color"
           [style.animation-delay]="p.delay + 's'"
           [style.animation-duration]="p.duration + 's'">
      </div>
    }
  </div>

  <!-- Content (z-10 para ficar sobre todas as camadas) -->
  <div class="relative z-10 container mx-auto px-6 text-center">

    <!-- Logo animado -->
    <div class="flex justify-center mb-8 animate-fade-in-down">
      <img src="logo_VUK.PNG"
           alt="VUK"
           class="h-36 md:h-52 w-auto object-contain logo-glow animate-float"
           style="animation-duration: 4s;">
    </div>

    <!-- Tagline principal -->
    <p class="text-3xl md:text-5xl font-light text-white mb-3 animate-fade-in tracking-wide" style="animation-delay: 0.3s;">
      Marketing & Propaganda
    </p>

    <!-- Linha decorativa -->
    <div class="flex items-center justify-center gap-4 mb-6 animate-fade-in" style="animation-delay: 0.45s;">
      <div class="h-px w-24 bg-gradient-to-r from-transparent to-vuk-primary-500"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-vuk-primary-400"></div>
      <div class="h-px w-24 bg-gradient-to-l from-transparent to-vuk-primary-500"></div>
    </div>

    <!-- Typewriter rotating text -->
    <div class="h-12 md:h-14 flex items-center justify-center gap-2 mb-8 animate-fade-in" style="animation-delay: 0.6s;">
      <span class="text-lg md:text-2xl text-vuk-dark-300 font-light">Especialistas em</span>
      <span class="text-lg md:text-2xl font-bold bg-gradient-vuk bg-clip-text text-transparent min-w-[180px] text-left">{{ currentText }}</span>
      <span class="text-vuk-primary-400 animate-blink text-2xl font-thin">|</span>
    </div>

    <p class="text-base md:text-lg text-vuk-dark-400 max-w-xl mx-auto mb-12 animate-fade-in leading-relaxed" style="animation-delay: 0.75s;">
      Transformamos ideias em experiências que conectam marcas e pessoas
    </p>

    <!-- CTA Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center animate-fade-in" style="animation-delay: 0.9s;">
      <button class="group relative px-10 py-4 bg-gradient-vuk rounded-full font-bold text-lg overflow-hidden transition-all duration-300 hover:shadow-vuk-glow hover:scale-105 btn-shine">
        <span class="relative z-10">Nossos Projetos</span>
      </button>
      <button class="px-10 py-4 border-2 border-vuk-primary-500/60 rounded-full font-semibold text-lg text-white hover:bg-vuk-primary-500/10 hover:border-vuk-primary-400 transition-all duration-300 hover:shadow-vuk-glow backdrop-blur-sm">
        Fale Conosco
      </button>
    </div>

    <!-- Scroll indicator -->
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-60 animate-bounce">
      <span class="text-xs text-vuk-dark-400 tracking-widest uppercase font-medium">Scroll</span>
      <div class="w-0.5 h-8 bg-gradient-to-b from-vuk-primary-400 to-transparent rounded-full"></div>
    </div>
  </div>

</section>
